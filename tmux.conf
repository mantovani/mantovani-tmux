# ── Core ──────────────────────────────────────────────────────
set -sg escape-time 0

# Terminal identity + truecolor passthrough. The machine colour is a 24-bit
# value, so getting this right is what makes it reproduce exactly.
#
# tmux 3.2+ adds the RGB feature itself when COLORTERM is truecolor or 24bit,
# which covers iTerm2, Ghostty, WezTerm, Kitty and GNOME Terminal unaided. The
# entry below is the fallback for the one case it cannot see: ssh forwards TERM
# but not COLORTERM, and the 256color terminfo entries don't advertise RGB.
#
# Apple Terminal is excluded because it is the only terminal that reports
# xterm-256color while having no 24-bit support — telling tmux otherwise makes
# the machine colour render wrong, not better. $TERM_PROGRAM is useless for the
# test (tmux overwrites it with "tmux" in the shells it spawns), so the real
# value is read back out of the server environment. Should Apple ever ship
# truecolor and set COLORTERM, the detection above grants RGB regardless.
set -g default-terminal "tmux-256color"
if-shell '[ "$(tmux show-environment -g TERM_PROGRAM 2>/dev/null)" != "TERM_PROGRAM=Apple_Terminal" ]' \
  'set -as terminal-features ",xterm-256color:RGB"'

# Mouse: scroll / resize / click panes + drag-select (Shift+drag bypasses to
# the terminal's native selection). README documents this as enabled.
set -g mouse on

# vi keys in copy-mode — REQUIRED so copy-mode-vi clipboard bindings apply
# (see ~/.tmux.local.conf for the xclip copy-pipe binding).
setw -g mode-keys vi

# Extended keys (CSI-u) so Claude Code can distinguish Shift+Enter from Enter
# for multi-line input. Line 1 enables it; line 2 declares the outer terminal
# supports it.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Prefix → Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# ── Status bar geometry (colour lives in ~/.tmux.local.conf) ──
# This file deliberately sets NO colours. Every coloured option — the bar, the
# window list, the pane borders, status-left and status-right — is generated by
# install.sh into the managed block in ~/.tmux.local.conf, derived from this
# machine's one colour. Defining any of them here too would mean two sources of
# truth for the same thing, and whichever loaded last would win.
set -g status-left-length 24
set -g status-right-length 200
set -g status-interval 2

# ── Background sampler (writes /tmp/tmuxm-stats-$USER every 2s) ───
# Pidfile-guarded inside the script so re-sourcing tmux.conf is a no-op.
# ~/.tmuxm is created by install.sh — either the clone itself or a symlink to it.
run-shell -b "bash ~/.tmuxm/bin/sampler.sh"

# ── Plugins (TPM) ─────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'

# ── Per-machine colour + overrides (not tracked in git) ───────
# install.sh always writes this file, so it always exists after an install.
source-file -q ~/.tmux.local.conf

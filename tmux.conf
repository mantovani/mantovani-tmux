# ── Core ──────────────────────────────────────────────────────
set -g mouse on
set -sg escape-time 0
set -g default-terminal "screen-256color"

# Prefix → Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Pane borders
set -g pane-border-style fg=gray
set -g pane-active-border-style fg=cyan

# ── Status bar: AI Vampire (left) + Matrix metrics (right) ────
set -g status-style "bg=#8B0000,fg=white"
set -g status-left-style "bg=#8B0000,fg=white"
set -g status-right-style "bg=#8B0000,fg=white"
set -g window-status-style "bg=#8B0000,fg=white"
set -g window-status-current-style "bg=#DC143C,fg=white,bold"

set -g status-left "#[bg=#000000,fg=#DC143C,bold] 🧛 AI Vampire #[bg=#8B0000,fg=white] "
set -g status-left-length 20

set -g status-right-length 200
set -g status-right "#[bg=#000000,fg=#00FF41] CPU #(bash ~/projects/github/mantovani-tmux/bin/matrix-bar.sh cpu) #[fg=#003B00]│#[fg=#00FF41] MEM #(bash ~/projects/github/mantovani-tmux/bin/matrix-bar.sh mem) #[fg=#003B00]│#[fg=#00FF41] NET ↓#{net_speed_bps_in} ↑#{net_speed_bps_out} #[fg=#003B00]│ #(bash ~/projects/github/mantovani-tmux/bin/net-info.sh) #[fg=#003B00]│#[fg=#39FF14,bold] @#h #[fg=#003B00]│#[fg=#00FF41,bold] %d/%m/%Y %H:%M "

set -g status-interval 2

# ── Plugins (TPM) ─────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-net-speed'
set -g @net_speed_format "%8s"
set -g @net_speed_interval 2

run '~/.tmux/plugins/tpm/tpm'

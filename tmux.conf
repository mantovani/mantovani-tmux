# ── Core ──────────────────────────────────────────────────────
set -sg escape-time 0

# Terminal identity + truecolor passthrough (outer TERM is xterm-256color on
# GNOME Terminal; the 256color terminfo entries don't advertise RGB, so :Tc
# tells tmux the outer terminal is truecolor-capable).
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Mouse: scroll / resize / click panes + drag-select (Shift+drag bypasses to
# the terminal's native selection). README documents this as enabled.
set -g mouse on

# vi keys in copy-mode — REQUIRED so copy-mode-vi clipboard bindings apply
# (see ~/.tmux.local.conf for the xclip copy-pipe binding).
setw -g mode-keys vi

# Extended keys (CSI-u) so Claude Code can distinguish Shift+Enter from Enter
# for multi-line input. Line 1 enables it; line 2 declares the outer terminal
# supports it.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Prefix → Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Pane borders
set -g pane-border-style fg=gray
set -g pane-active-border-style fg=cyan

# ── Status bar: AI Vampire (left) + Matrix metrics (right) ────
set -g status-style "bg=#8B0000,fg=white"
set -g status-left-style "bg=#8B0000,fg=white"
set -g status-right-style "bg=#8B0000,fg=white"
set -g window-status-style "bg=#8B0000,fg=white"
set -g window-status-current-style "bg=#DC143C,fg=white,bold"

set -g status-left "#[bg=#000000,fg=#DC143C,bold] 🧛 AI Vampire #[bg=#8B0000,fg=white] "
set -g status-left-length 20

set -g status-right-length 200
set -g status-right "#[bg=#000000,fg=#00FF41] CPU #(bash ~/projects/github/mantovani-tmux/bin/render-bar.sh cpu) #[fg=#003B00]│#[fg=#00FF41] MEM #(bash ~/projects/github/mantovani-tmux/bin/render-bar.sh mem) #[fg=#003B00]│#[fg=#00FF41] ↓ #(bash ~/projects/github/mantovani-tmux/bin/render-net.sh in) ↑ #(bash ~/projects/github/mantovani-tmux/bin/render-net.sh out) #[fg=#003B00]│#[fg=#39FF14,bold] @#h #[fg=#003B00]│#[fg=#00FF41,bold] %d/%m/%Y %H:%M "

set -g status-interval 2

# ── Background sampler (writes /tmp/tmux-stats-$USER every 2s) ────
# Pidfile-guarded inside the script so re-sourcing tmux.conf is a no-op.
run-shell -b "bash ~/projects/github/mantovani-tmux/bin/sampler.sh"

# ── Plugins (TPM) ─────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'

# ── Per-machine theme overrides (not tracked in git) ──────────
# Create ~/.tmux.local.conf to override colors per machine. See README.
source-file -q ~/.tmux.local.conf

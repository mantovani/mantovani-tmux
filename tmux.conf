# ── Core ──────────────────────────────────────────────────────
set -sg escape-time 0

# Terminal identity + truecolor passthrough (outer TERM is xterm-256color on
# GNOME Terminal; the 256color terminfo entries don't advertise RGB, so :Tc
# tells tmux the outer terminal is truecolor-capable).
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Mouse: scroll / resize / click panes + drag-select (Shift+drag bypasses to
# the terminal's native selection). README documents this as enabled.
set -g mouse on

# vi keys in copy-mode — REQUIRED so copy-mode-vi clipboard bindings apply
# (see ~/.tmux.local.conf for the xclip copy-pipe binding).
setw -g mode-keys vi

# Extended keys (CSI-u) so Claude Code can distinguish Shift+Enter from Enter
# for multi-line input. Line 1 enables it; line 2 declares the outer terminal
# supports it.
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'

# Prefix → Ctrl+a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Pane borders
set -g pane-border-style fg=gray
set -g pane-active-border-style fg=#A78BFA

# ── Status bar: AI Wizard (left) + arcane metrics (right) ─────
set -g status-style "bg=#4c1d95,fg=white"
set -g status-left-style "bg=#4c1d95,fg=white"
set -g status-right-style "bg=#4c1d95,fg=white"
set -g window-status-style "bg=#4c1d95,fg=white"
set -g window-status-current-style "bg=#8b5cf6,fg=white,bold"

# The trailing gap stays on black with the badge: status-left must look the same
# on every machine, so nothing in it may reference the per-machine bar colour.
set -g status-left "#[bg=#000000,fg=#FBBF24,bold] 🧙 AI Wizard 🔮 #[bg=#000000,fg=white] "
set -g status-left-length 24

set -g status-right-length 200
set -g status-right "#[bg=#000000,fg=#A78BFA] CPU #(bash ~/.tmuxm/bin/render-bar.sh cpu) #[fg=#4C1D95]│#[fg=#A78BFA] MEM #(bash ~/.tmuxm/bin/render-bar.sh mem) #[fg=#4C1D95]│#[fg=#A78BFA] ↓ #(bash ~/.tmuxm/bin/render-net.sh in) ↑ #(bash ~/.tmuxm/bin/render-net.sh out) #[fg=#4C1D95]│#[fg=#C4B5FD,bold] @#h #[fg=#4C1D95]│#[fg=#A78BFA,bold] %d/%m/%Y %H:%M "

set -g status-interval 2

# ── Background sampler (writes /tmp/tmuxm-stats-$USER every 2s) ───
# Pidfile-guarded inside the script so re-sourcing tmux.conf is a no-op.
# ~/.tmuxm is created by install.sh — either the clone itself or a symlink to it.
run-shell -b "bash ~/.tmuxm/bin/sampler.sh"

# ── Plugins (TPM) ─────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'

run '~/.tmux/plugins/tpm/tpm'

# ── Per-machine theme overrides (not tracked in git) ──────────
# Create ~/.tmux.local.conf to override colors per machine. See README.
source-file -q ~/.tmux.local.conf
